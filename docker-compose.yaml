services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - microservices-net

  inventory:
    build: ./inventory
    container_name: inventory
    ports:
      - "8000:8000"
    env_file: ./inventory/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  inventory-consumer:
    build: ./inventory
    container_name: inventory-consumer
    command: ["python", "consumer.py"]
    env_file: ./inventory/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  payment:
    build: ./payment
    container_name: payment
    ports:
      - "8001:8001"
    env_file: ./payment/.env
    environment:
      - REDIS_HOST=redis
      - INVENTORY_SERVICE_URL=http://inventory:8000
    depends_on:
      redis:
        condition: service_healthy
      inventory:
        condition: service_started
    networks:
      - microservices-net

  payment-consumer:
    build: ./payment
    container_name: payment-consumer
    command: ["python", "consumer.py"]
    env_file: ./payment/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  notification-consumer:
    build: ./notification
    container_name: notification-consumer
    env_file: ./notification/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge